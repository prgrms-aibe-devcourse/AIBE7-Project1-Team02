<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>일정 생성 | ExploraJourneys</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/common.css" />
    <link rel="stylesheet" href="../styles/trip-create.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../scripts/trip-create.js" defer></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>
      
        <main class="trip-create-page">
         <!-- <a class="back-link" href="../index.html">메인으로 돌아가기</a> -->

          <section class="trip-create-panel">
            <div class="trip-create-heading">
          <span>TRIP PLANNER</span>
          <h1>AI 일정 생성</h1>
          <p>
            메인에서 고른 여행지와 사용자 성향, 선택한 지역을 바탕으로 일정을
            생성합니다.
          </p>
        </div>

        <div class="form-actions" style="margin-top: 1rem">
          <button
            type="button"
            class="btn-primary"
            id="trip-reset-btn"
            style="width: auto; padding-inline: 1rem"
          >
            초기화
          </button>
        </div>

        <article class="selected-destination" id="selected-destination" hidden>
          <div class="selected-destination-content">
            <span class="selected-label">선택한 여행지</span>
            <h2 id="selected-destination-name"></h2>
            <p id="selected-destination-address"></p>
            <div
              class="selected-destination-keywords"
              id="selected-destination-keywords"
            ></div>
          </div>
        </article>

        <form id="trip-create-form" class="trip-create-form">
          <label>
            여행 시작일
            <input type="date" id="start-date" required />
          </label>

          <label>
            여행 종료일
            <input type="date" id="end-date" required />
          </label>

          <label>
            인원수
            <input
              type="number"
              id="people-count"
              min="1"
              step="1"
              value="1"
              required
            />
          </label>

          <label>
            지역
            <select id="region">
              <option value="">지역을 선택하세요</option>
              <option value="강원특별자치도">강원특별자치도</option>
              <option value="경기도">경기도</option>
              <option value="경상남도">경상남도</option>
              <option value="경상북도">경상북도</option>
              <option value="광주광역시">광주광역시</option>
              <option value="대구광역시">대구광역시</option>
              <option value="대전광역시">대전광역시</option>
              <option value="부산광역시">부산광역시</option>
              <option value="서울특별시">서울특별시</option>
              <option value="세종특별자치시">세종특별자치시</option>
              <option value="울산광역시">울산광역시</option>
              <option value="인천광역시">인천광역시</option>
              <option value="전라남도">전라남도</option>
              <option value="전북특별자치도">전북특별자치도</option>
              <option value="제주특별자치도">제주특별자치도</option>
              <option value="충청남도">충청남도</option>
              <option value="충청북도">충청북도</option>
            </select>
          </label>

          <label>
            메모
            <textarea
              id="memo"
              rows="4"
              placeholder="원하는 분위기나 꼭 가고 싶은 장소를 적어주세요."
            ></textarea>
          </label>
          <!-- <label> 키워드 </label> -->
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="plan-submit-btn">
              일정 생성하기
            </button>
          </div>
        </form>

        <div class="plan-loading" id="plan-loading" hidden>
          AI가 일정을 생성하고 있습니다. 잠시만 기다려 주세요.
        </div>

        <section class="plan-result" id="plan-result" hidden>
          <div class="plan-result-header">
            <div>
              <span class="selected-label">생성된 일정</span>
              <h2 id="plan-title"></h2>
              <p id="plan-summary"></p>
            </div>
          </div>
          <div class="plan-days" id="plan-days"></div>
          <div class="plan-result-actions">
            <button
              type="button"
              class="btn-secondary"
              id="plan-save-btn"
              hidden
            >
              일정 저장하기
            </button>
          </div>
        </section>

        <div class="trip-create-empty" id="trip-create-empty">
          <h2>아직 일정이 없습니다.</h2>
          <p>조건을 입력하고 AI 일정 생성을 눌러주세요.</p>
        </div>
      </section>
    </main>
    <script src="/scripts/layout.js"></script>
  </body>
</html>
