<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packing | 여행 일정 생성</title>
    <link rel="icon" type="image/png" href="/images/packing-logo.png" />
    <link rel="apple-touch-icon" href="/images/packing-logo.png" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/trip-create.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/trip-create.js" defer></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>
      
        <main class="trip-create-page">
          <!-- <a class="back-link" href="../index.html">메인으로 돌아가기</a> -->

          <section class="trip-create-panel" id="trip-create-input-view">
            <div class="trip-create-topbar">
              <div class="trip-create-heading">
                <span>TRIP PLANNER</span>
                <h1>AI 일정 생성</h1>
                <p>
                  메인에서 고른 여행지와 사용자 성향, 선택한 지역을 바탕으로 일정을
                  생성합니다.
                </p>
              </div>

              <button
                type="button"
                class="trip-reset-button"
                id="trip-reset-btn"
              >
                <i data-lucide="rotate-ccw"></i>
                초기화
              </button>
            </div>

        <article class="selected-destination" id="selected-destination" hidden>
          <div class="selected-destination-content">
            <span class="selected-label">선택한 여행지</span>
            <h2 id="selected-destination-name"></h2>
            <p id="selected-destination-address"></p>
            <div
              class="selected-destination-keywords"
              id="selected-destination-keywords"
            ></div>
          </div>
        </article>

        <form id="trip-create-form" class="trip-create-form">
          <label>
            여행 시작일
            <input type="date" id="start-date" required />
          </label>

          <label>
            여행 종료일
            <input type="date" id="end-date" required />
            <span class="form-help">현재 관광지 데이터 기준 최대 7일 일정까지 생성할 수 있습니다.</span>
          </label>

          <label>
            동행 유형
            <button
              class="trip-companion-select"
              id="trip-companion-select"
              type="button"
            >
              <span id="trip-companion-summary">혼자</span>
              <i data-lucide="chevron-down"></i>
            </button>
            <input type="hidden" id="people-count" value="1" />
          </label>

          <label>
            지역
            <button
              class="trip-region-select"
              id="trip-region-select"
              type="button"
            >
              <span id="trip-region-summary">지역을 선택하세요</span>
              <i data-lucide="chevron-down"></i>
            </button>
            <input type="hidden" id="region" />
          </label>

          <section class="trip-keyword-field" aria-labelledby="trip-keyword-title">
            <div class="trip-keyword-header">
              <div>
                <span id="trip-keyword-title">여행 키워드</span>
                <p>음악 취향을 고르듯 끌리는 분위기를 최대 3개까지 골라주세요.</p>
              </div>
              <strong id="trip-keyword-count">0/3</strong>
            </div>
            <div
              class="trip-keyword-cloud"
              id="trip-keyword-cloud"
              aria-live="polite"
            ></div>
            <p class="trip-keyword-warning" id="trip-keyword-warning" hidden>
              키워드는 최대 3개까지 선택할 수 있습니다.
            </p>
            <input type="hidden" id="memo" />
          </section>
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="plan-submit-btn">
              일정 생성하기
            </button>
          </div>
        </form>

        <div class="plan-loading" id="plan-loading" hidden>
          AI가 일정을 생성하고 있습니다. 잠시만 기다려 주세요.
        </div>

      </section>

        <section class="plan-result" id="plan-result" hidden>
          <div class="plan-result-header">
            <div>
              <span class="selected-label">생성된 일정</span>
              <h2 id="plan-title"></h2>
              <p id="plan-summary"></p>
            </div>
            <button
              type="button"
              class="btn-secondary plan-edit-btn"
              id="plan-edit-btn"
            >
              조건 다시 수정하기
            </button>
          </div>
          <div class="plan-days" id="plan-days"></div>
          <div class="plan-result-actions">
            <button
              type="button"
              class="btn-secondary"
              id="plan-save-btn"
              hidden
            >
              일정 저장하기
            </button>
          </div>
        </section>

      <div
        class="generated-day-modal"
        id="generated-day-modal"
        aria-hidden="true"
      >
        <article
          class="generated-day-modal-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="generated-day-modal-title"
        >
          <header class="generated-day-modal-header">
            <div>
              <span class="selected-label" id="generated-day-modal-status">DAY ROUTE</span>
              <h2 id="generated-day-modal-title">DAY 일정</h2>
              <p id="generated-day-modal-period"></p>
            </div>
            <button
              class="generated-day-modal-close"
              id="generated-day-modal-close"
              type="button"
              aria-label="DAY 일정 닫기"
            >
              <i data-lucide="x"></i>
            </button>
          </header>
          <div class="generated-day-modal-body" id="generated-day-modal-body"></div>
        </article>
      </div>

      <div class="trip-region-modal" id="trip-region-modal" aria-hidden="true">
        <section
          class="trip-region-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="trip-region-modal-title"
        >
          <header class="trip-region-modal-header">
            <div>
              <span class="selected-label">REGION</span>
              <h2 id="trip-region-modal-title">지역 선택</h2>
            </div>
            <button
              class="trip-region-modal-close"
              id="trip-region-modal-close"
              type="button"
              aria-label="지역 선택 닫기"
            >
              <i data-lucide="x"></i>
            </button>
          </header>
          <div class="trip-region-options" id="trip-region-options"></div>
          <footer class="trip-region-modal-actions">
            <button
              class="trip-region-modal-clear"
              id="trip-region-modal-clear"
              type="button"
            >
              선택 해제
            </button>
            <button
              class="btn-primary"
              id="trip-region-modal-apply"
              type="button"
            >
              완료
            </button>
          </footer>
        </section>
      </div>

      <div
        class="trip-region-modal"
        id="trip-companion-modal"
        aria-hidden="true"
      >
        <section
          class="trip-region-dialog"
          role="dialog"
          aria-modal="true"
          aria-labelledby="trip-companion-modal-title"
        >
          <header class="trip-region-modal-header">
            <div>
              <span class="selected-label">WITH</span>
              <h2 id="trip-companion-modal-title">동행 유형 선택</h2>
            </div>
            <button
              class="trip-region-modal-close"
              id="trip-companion-modal-close"
              type="button"
              aria-label="동행 유형 선택 닫기"
            >
              <i data-lucide="x"></i>
            </button>
          </header>
          <div class="trip-region-options" id="trip-companion-options"></div>
          <footer class="trip-region-modal-actions">
            <button
              class="btn-primary"
              id="trip-companion-modal-apply"
              type="button"
            >
              완료
            </button>
          </footer>
        </section>
      </div>
        </main>
      </div>
    </div>
  </body>
</html>
