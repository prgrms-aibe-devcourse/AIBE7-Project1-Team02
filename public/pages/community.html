<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packing | Community</title>
    <link rel="icon" type="image/png" href="/images/packing-logo.png" />
    <link rel="apple-touch-icon" href="/images/packing-logo.png" />
    <meta
      name="description"
      content="국내 여행 경험과 후기를 공유하고, 다른 사용자의 여행 게시글을 탐색하는 커뮤니티 페이지입니다."
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/community.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="community-page" id="community-page">
          <div class="travel-community-wrapper">
            <header class="community-header-minimal">
              <div class="header-minimal-top">
                <h1>어디로 떠나시나요?</h1>
              </div>
              <div class="category-pills-scroll">
                <div class="tag-list-horizontal" id="popular-tags"></div>
              </div>
            </header>

            <div class="community-gallery-grid" id="community-feed"></div>
          </div>
        </main>
      </div>
    </div>

    <button
      class="btn-write-fab"
      id="btn-write-post"
      type="button"
      aria-label="작성하기"
    >
      <i data-lucide="plus"></i>
    </button>

    <div class="modal-overlay" id="post-modal">
      <div class="modal-content community-modal">
        <button
          class="modal-close-btn"
          id="post-modal-close"
          type="button"
          aria-label="닫기"
        >
          <i data-lucide="x"></i>
        </button>

        <section class="flow-b-section">
          <div class="section-header" style="margin-bottom: 1rem">
            <h2>여행 게시글 작성</h2>
            <p>후기와 사진을 함께 올려 여행 이야기를 풍성하게 공유해보세요.</p>
          </div>

          <form id="post-form" class="community-form">
            <label>
              게시글 유형
              <select id="post-type">
                <option value="여행후기">여행후기</option>
                <option value="맛집">맛집</option>
                <option value="카페">카페</option>
                <option value="숙소">숙소</option>
                <option value="명소">명소</option>
              </select>
            </label>

            <label>
              제목
              <input
                id="post-title"
                type="text"
                placeholder="예: 제주에서 본 가장 예쁜 노을"
              />
            </label>

            <label>
              후기
              <textarea
                id="post-summary"
                rows="4"
                placeholder="여행 후기를 자유롭게 적어주세요."
              ></textarea>
            </label>

            <div class="editor-toolbar">
              <button type="button" class="editor-btn" data-insert-image-token>
                이미지 삽입
              </button>
              <span class="editor-hint"
                >후기 안에 이미지를 넣고 싶다면 커서 위치에 이미지 토큰을
                삽입하세요.</span
              >
            </div>

            <div
              class="image-dropzone"
              id="post-image-dropzone"
              role="button"
              tabindex="0"
            >
              <div class="image-dropzone-copy">
                <strong>사진을 드래그 앤 드랍하거나 클릭해서 추가하세요</strong>
                <p>PNG, JPG, JPEG, WEBP 파일을 여러 장 업로드할 수 있습니다.</p>
              </div>
              <input
                id="post-image-file"
                type="file"
                accept="image/png,image/jpeg,image/jpg,image/webp"
                multiple
                hidden
              />
            </div>

            <div class="image-preview-wrap">
              <div class="image-order-list" id="post-image-order-list"></div>
              <div id="post-image-gallery" class="image-gallery"></div>
            </div>

            <label>
              태그
              <div class="tag-input-container" id="tag-input-container">
                <div class="tag-chip-list" id="tag-chip-list"></div>
                <input
                  id="post-tags"
                  type="text"
                  placeholder="태그 입력 후 엔터 (예: 부산)"
                />
              </div>
            </label>

            <label>
              지역
              <input
                id="post-location"
                type="text"
                placeholder="예: 제주특별자치도 서귀포시"
              />
            </label>

            <label>
              카테고리
              <input
                id="post-category"
                type="text"
                placeholder="예: 자연, 맛집, 숙소"
              />
            </label>

            <div class="form-actions">
              <button type="submit" class="btn-primary">게시글 등록</button>
            </div>
          </form>
        </section>
      </div>
    </div>

    <div class="modal-overlay" id="comment-modal">
      <div class="modal-content community-modal">
        <section class="comment-modal-container">
          <div class="comment-modal-header">
            <button
              class="comment-back-btn"
              id="comment-modal-close"
              type="button"
              aria-label="닫기"
            >
              <i data-lucide="arrow-left"></i>
            </button>
            <h2 id="comment-post-title" class="comment-modal-title">
              Comments
            </h2>
            <button
              class="comment-more-btn"
              type="button"
              aria-label="옵션 더보기"
            >
              <i data-lucide="more-horizontal"></i>
            </button>
          </div>

          <div class="comment-modal-body">
            <div class="comment-list" id="comment-list"></div>
          </div>

          <div class="comment-modal-footer">
            <img
              id="comment-user-avatar"
              src=""
              alt="내 프로필"
              class="comment-user-avatar"
            />
            <form id="comment-form" class="comment-chat-form">
              <input type="hidden" id="comment-post-id" />
              <div class="chat-input-wrapper">
                <textarea
                  id="comment-text"
                  rows="1"
                  placeholder="댓글을 입력하세요..."
                ></textarea>
                <button type="submit" class="btn-text-primary">게시</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>

    <div class="modal-overlay" id="post-detail-modal">
      <div class="modal-content community-modal detail-modal">
        <button
          class="modal-close-btn"
          id="detail-modal-close"
          type="button"
          aria-label="닫기"
        >
          <i data-lucide="x"></i>
        </button>
        <div class="detail-layout">
          <div class="detail-media">
            <div id="detail-gallery" class="detail-gallery"></div>
            <button
              type="button"
              id="gallery-prev-btn"
              class="gallery-nav-btn prev-btn"
              hidden
            >
              <i data-lucide="chevron-left"></i>
            </button>
            <button
              type="button"
              id="gallery-next-btn"
              class="gallery-nav-btn next-btn"
              hidden
            >
              <i data-lucide="chevron-right"></i>
            </button>
            <div id="gallery-pagination" class="gallery-pagination"></div>
          </div>
          <div class="detail-content">
            <p class="community-kicker" id="detail-category">게시글 상세</p>
            <h2 id="detail-title" class="detail-title"></h2>
            <div class="detail-meta">
              <img
                id="detail-author-avatar"
                src=""
                alt="프로필"
                class="detail-author-avatar"
                loading="lazy"
                hidden
              />
              <div class="detail-meta-text">
                <span id="detail-author"></span>
                <span id="detail-time"></span>
              </div>
            </div>
            <div id="detail-tags" class="tag-list-horizontal detail-tags"></div>
            <p id="detail-summary" class="detail-summary"></p>
            <div class="detail-actions">
              <button type="button" class="action-link" id="detail-like-btn">
                <i data-lucide="heart"></i> 좋아요
              </button>
              <button type="button" class="action-link" id="detail-comment-btn">
                <i data-lucide="message-circle"></i> 댓글
              </button>
              <button type="button" class="action-link" id="detail-share-btn">
                <i data-lucide="share-2"></i> 공유
              </button>
              <button type="button" class="action-link" id="detail-edit-btn">
                <i data-lucide="edit-2"></i> 수정
              </button>
              <button
                type="button"
                class="action-link danger"
                id="detail-delete-btn"
              >
                <i data-lucide="trash-2"></i> 삭제
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal-overlay image-lightbox"
      id="image-lightbox"
      aria-hidden="true"
    >
      <div class="image-lightbox-content">
        <button
          class="modal-close-btn"
          id="image-lightbox-close"
          type="button"
          aria-label="닫기"
        >
          <i data-lucide="x"></i>
        </button>
        <img id="image-lightbox-img" alt="확대 이미지" />
      </div>
    </div>

    <script src="/scripts/layout.js"></script>
    <script src="../scripts/community.js"></script>
  </body>
</html>
