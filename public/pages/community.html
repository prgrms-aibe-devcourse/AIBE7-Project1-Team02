<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packing | 커뮤니티</title>
    <link rel="icon" type="image/png" href="/images/packing-logo.png" />
    <link rel="apple-touch-icon" href="/images/packing-logo.png" />
    <meta
      name="description"
      content="국내 여행 경험과 후기를 공유하고, 다른 사용자의 여행 게시글을 탐색하는 커뮤니티 페이지입니다."
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/community.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="community-page" id="community-page">
          <div class="travel-community-wrapper">
            <header class="community-header-minimal">
              <div class="header-minimal-top">
                <h1>당신의 이야기를 들려주세요</h1>
              </div>
              <div class="category-pills-scroll">
                <div class="tag-list-horizontal" id="popular-tags"></div>
              </div>
            </header>

            <div class="community-gallery-grid" id="community-feed"></div>
          </div>
        </main>
      </div>
    </div>

    <button
      class="btn-write-fab"
      id="btn-write-post"
      type="button"
      aria-label="작성하기"
    >
      <i data-lucide="plus"></i>
    </button>

    <div class="fullscreen-editor" id="post-fullscreen-editor">
      <div class="fs-editor-header">
        <button
          type="button"
          class="fs-back-btn"
          id="post-modal-close"
          aria-label="닫기"
        >
          <i data-lucide="arrow-left"></i>
        </button>
        <div class="fs-header-copy">
          <span class="fs-header-title">여행 이야기 작성</span>
          <span class="fs-header-subtitle"
            >국내 여행 경험을 사진과 함께 공유해보세요.</span
          >
        </div>
        <button
          type="button"
          class="btn-primary fs-publish-btn"
          id="btn-fs-publish"
        >
          작성하기
        </button>
      </div>

      <div class="fs-editor-content">
        <form id="post-form" class="fs-form">
          <div class="fs-paper">
            <!-- 1. Title -->
            <div class="fs-title-block">
              <input
                id="post-title"
                class="fs-title-input"
                type="text"
                maxlength="80"
                placeholder="제목을 입력하세요"
              />
              <div class="fs-title-count" id="post-title-count">0/80</div>
            </div>

            <!-- 2. Meta (Location / Tags) -->
            <div class="fs-meta-block">
              <label class="fs-meta-item" for="post-location">
                <i data-lucide="map-pin"></i>
                <input
                  id="post-location"
                  type="text"
                  placeholder="위치 추가 (예: 제주 서귀포시)"
                />
              </label>

              <label class="fs-meta-item" for="post-tags">
                <i data-lucide="hash"></i>
                <div
                  class="tag-input-container fs-tag-input"
                  id="tag-input-container"
                >
                  <div class="tag-chip-list" id="tag-chip-list"></div>
                  <input
                    id="post-tags"
                    type="text"
                    placeholder="태그 추가 (쉼표 또는 Enter)"
                  />
                </div>
              </label>
            </div>

            <!-- 3. Photos -->
            <div class="fs-photo-block">
              <div class="fs-block-header">
                <strong>사진 첨부</strong>
                <span id="post-image-count">0/10장</span>
              </div>
              <div
                class="fs-inline-media"
                id="post-image-dropzone"
                role="button"
                tabindex="0"
              >
                <button
                  type="button"
                  class="btn-fs-inline-photo"
                  id="btn-add-photo"
                  aria-label="사진 추가하기"
                >
                  <i data-lucide="image-plus"></i>
                </button>
                <div class="fs-inline-hint">
                  <strong>사진 추가</strong>
                  <span>클릭하거나 이미지를 끌어다 놓으세요.</span>
                </div>
                <input
                  id="post-image-file"
                  type="file"
                  accept="image/png,image/jpeg,image/jpg,image/webp"
                  multiple
                  hidden
                />
              </div>
              <div class="image-preview-wrap fs-image-preview">
                <div class="image-order-list" id="post-image-order-list"></div>
                <div id="post-image-gallery" class="image-gallery"></div>
              </div>
            </div>

            <!-- 4. Body & Toolbar -->
            <div class="fs-body-block">
              <div class="editor-toolbar">
                <button
                  type="button"
                  class="toolbar-btn"
                  data-cmd="heading"
                  aria-label="제목"
                  title="제목"
                >
                  <i data-lucide="heading"></i>
                </button>
                <button
                  type="button"
                  class="toolbar-btn"
                  data-cmd="bold"
                  aria-label="굵게"
                  title="굵게"
                >
                  <i data-lucide="bold"></i>
                </button>
                <button
                  type="button"
                  class="toolbar-btn"
                  data-cmd="italic"
                  aria-label="기울임"
                  title="기울임"
                >
                  <i data-lucide="italic"></i>
                </button>
                <div class="toolbar-spacer"></div>
                <span class="body-count" id="post-summary-count">0/2000자</span>
              </div>
              <div
                id="post-summary"
                class="fs-body-input"
                contenteditable="true"
                data-placeholder="여러분의 소중한 여행 이야기를 들려주세요..."
              ></div>
            </div>
          </div>

          <!-- This hidden submit button helps keep the standard form submit working -->
          <button
            type="submit"
            id="hidden-form-submit"
            style="display: none"
          ></button>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="comment-modal">
      <div class="modal-content community-modal">
        <section class="comment-modal-container">
          <div class="comment-modal-header">
            <button
              class="comment-back-btn"
              id="comment-modal-close"
              type="button"
              aria-label="닫기"
            >
              <i data-lucide="arrow-left"></i>
            </button>
            <h2 id="comment-post-title" class="comment-modal-title">
              Comments
            </h2>
            <button
              class="comment-more-btn"
              type="button"
              aria-label="옵션 더보기"
            >
              <i data-lucide="more-horizontal"></i>
            </button>
          </div>

          <div class="comment-modal-body">
            <div class="comment-list" id="comment-list"></div>
          </div>

          <div class="comment-modal-footer">
            <img
              id="comment-user-avatar"
              src=""
              alt="내 프로필"
              class="comment-user-avatar"
            />
            <form id="comment-form" class="comment-chat-form">
              <input type="hidden" id="comment-post-id" />
              <div class="chat-input-wrapper">
                <textarea
                  id="comment-text"
                  rows="1"
                  placeholder="댓글을 입력하세요..."
                ></textarea>
                <button type="submit" class="btn-text-primary">게시</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </div>

    <div class="modal-overlay" id="post-detail-modal">
      <div class="modal-content community-modal detail-modal">
        <button
          class="modal-close-btn"
          id="detail-modal-close"
          type="button"
          aria-label="닫기"
        >
          <i data-lucide="x"></i>
        </button>
        <div class="detail-layout">
          <div class="detail-media">
            <div id="detail-gallery" class="detail-gallery"></div>
            <button
              type="button"
              id="gallery-prev-btn"
              class="gallery-nav-btn prev-btn"
              hidden
            >
              <i data-lucide="chevron-left"></i>
            </button>
            <button
              type="button"
              id="gallery-next-btn"
              class="gallery-nav-btn next-btn"
              hidden
            >
              <i data-lucide="chevron-right"></i>
            </button>
            <div id="gallery-pagination" class="gallery-pagination"></div>
          </div>
          <div class="detail-content">
            <p class="community-kicker" id="detail-category">게시글 상세</p>
            <h2 id="detail-title" class="detail-title"></h2>
            <div class="detail-meta">
              <img
                id="detail-author-avatar"
                src=""
                alt="프로필"
                class="detail-author-avatar"
                loading="lazy"
                hidden
              />
              <div class="detail-meta-text">
                <span id="detail-author"></span>
                <span id="detail-time"></span>
              </div>
            </div>
            <div id="detail-tags" class="tag-list-horizontal detail-tags"></div>
            <p id="detail-summary" class="detail-summary"></p>
            <div class="detail-actions">
              <button type="button" class="action-link" id="detail-like-btn">
                <i data-lucide="heart"></i> 좋아요
              </button>
              <button type="button" class="action-link" id="detail-comment-btn">
                <i data-lucide="message-circle"></i> 댓글
              </button>
              <button type="button" class="action-link" id="detail-share-btn">
                <i data-lucide="share-2"></i> 공유
              </button>
              <button type="button" class="action-link" id="detail-edit-btn">
                <i data-lucide="edit-2"></i> 수정
              </button>
              <button
                type="button"
                class="action-link danger"
                id="detail-delete-btn"
              >
                <i data-lucide="trash-2"></i> 삭제
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal-overlay image-lightbox"
      id="image-lightbox"
      aria-hidden="true"
    >
      <div class="image-lightbox-content">
        <button
          class="modal-close-btn"
          id="image-lightbox-close"
          type="button"
          aria-label="닫기"
        >
          <i data-lucide="x"></i>
        </button>
        <img id="image-lightbox-img" alt="확대 이미지" />
      </div>
    </div>

    <script src="/scripts/layout.js"></script>
    <script src="../scripts/community.js"></script>
  </body>
</html>
