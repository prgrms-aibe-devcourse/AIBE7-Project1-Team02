<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | ExploraJourneys</title>
    <meta
      name="description"
      content="ExploraJourneys에 로그인하고 여행 MBTI 추천과 일정 생성 기능을 사용해보세요."
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="dashboard-content auth-page">
          <section class="auth-layout" aria-labelledby="title">
            <div class="auth-hero">
              <span class="recommendation-eyebrow">WELCOME BACK</span>
              <h1>여행 취향에 맞는 다음 목적지를 찾아볼까요?</h1>
              <p>
                로그인하면 저장된 여행 MBTI를 바탕으로 추천 여행지와 일정 생성
                기능을 이어서 사용할 수 있습니다.
              </p>
              <div class="auth-benefits" aria-label="로그인 후 사용 가능한 기능">
                <span><i data-lucide="sparkles"></i> MBTI 맞춤 추천</span>
                <span><i data-lucide="map"></i> 여행 일정 생성</span>
                <span><i data-lucide="bookmark"></i> 저장한 일정 확인</span>
              </div>
            </div>

            <div id="authWrap" class="auth-panel">
              <div class="auth-card">
                <div class="auth-card-header">
                  <span class="auth-card-icon">
                    <i data-lucide="user-round"></i>
                  </span>
                  <div>
                    <h2 id="title">로그인</h2>
                    <p id="subtitle" hidden></p>
                  </div>
                </div>

                <div id="alert" class="auth-alert"></div>

                <div id="nicknameWrap" class="auth-form-group" hidden>
                  <label for="nickname">닉네임</label>
                  <input
                    id="nickname"
                    type="text"
                    placeholder="닉네임 입력"
                    autocomplete="nickname"
                  />
                </div>

                <div class="auth-form-group">
                  <label for="email">이메일</label>
                  <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                  />
                </div>

                <div class="auth-form-group">
                  <label for="password">비밀번호</label>
                  <input
                    id="password"
                    type="password"
                    placeholder="비밀번호 입력"
                    autocomplete="current-password"
                  />
                </div>

                <div class="auth-button-row">
                  <button id="submitBtn" class="btn-primary auth-submit" type="button">
                    로그인
                  </button>
                  <button id="clearBtn" class="auth-secondary" type="button">
                    초기화
                  </button>
                </div>

                <div class="auth-switch-row">
                  <button id="switchToSignup" class="auth-link-button" type="button">
                    회원가입으로 이동
                  </button>
                  <button
                    id="switchToLogin"
                    class="auth-link-button"
                    type="button"
                    hidden
                  >
                    로그인으로 이동
                  </button>
                </div>

                <div id="success" class="auth-success"></div>

                <p class="auth-note">
                  로그인이 필요한 메뉴로 이동했다면 로그인 후 해당 페이지로 다시
                  돌아갑니다.
                </p>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="/scripts/layout.js"></script>
    <script src="../scripts/login.js"></script>
  </body>
</html>
