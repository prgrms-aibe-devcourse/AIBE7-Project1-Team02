<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip AI 로그인 / 회원가입</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f4f7f5, #e8f5ee);
        color: #1a2b1f;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .wrap {
        width: min(100%, 480px);
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #dfe7e1;
        border-radius: 18px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        padding: 28px;
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 20px; color: #4a6155; line-height: 1.5; }
      .form-group { margin-bottom: 14px; }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #4a6155;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #c9d6cf;
        border-radius: 12px;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: #1a5c3a;
        box-shadow: 0 0 0 3px rgba(26, 92, 58, 0.08);
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        cursor: pointer;
        font-weight: 700;
      }
      .primary {
        background: #1a5c3a;
        color: #fff;
        flex: 1;
      }
      .secondary {
        background: #e8f5ee;
        color: #1a5c3a;
      }
      .alert {
        display: none;
        margin-bottom: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #fef7e0;
        border: 1px solid #f7d56b;
        color: #8a6500;
        white-space: pre-line;
      }
      .success {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #e8f5ee;
        border: 1px solid #b8ddc7;
        color: #1a5c3a;
        white-space: pre-line;
      }
      .sub {
        margin-top: 18px;
        font-size: 12px;
        color: #6b7f73;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="authWrap" class="wrap">
      <div class="card">
        <h1 id="title">로그인</h1>
        <p id="subtitle">Supabase 계정으로 로그인하세요.</p>

        <div id="alert" class="alert"></div>

        <div id="nicknameWrap" class="form-group" style="display:none;">
          <label for="nickname">닉네임</label>
          <input id="nickname" type="text" placeholder="닉네임 입력" autocomplete="nickname" />
        </div>

        <div class="form-group">
          <label for="email">이메일</label>
          <input id="email" type="email" placeholder="example@email.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <input id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" />
        </div>

        <div class="btn-row">
          <button id="submitBtn" class="primary">로그인</button>
          <button id="clearBtn" class="secondary" type="button">초기화</button>
        </div>

        <div style="margin-top: 12px; display:flex; gap: 8px; flex-wrap: wrap;">
          <button id="switchToSignup" class="secondary" type="button">회원가입으로 이동</button>
          <button id="switchToLogin" class="secondary" type="button" style="display:none;">로그인으로 이동</button>
        </div>

        <div id="success" class="success"></div>

        <div class="sub">
          로그인 성공 시 `sessionStorage`에 토큰이 저장됩니다.
        </div>
      </div>
    </div>

    <script src="../scripts/login.js"></script>
  </body>
</html>
