<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packing | 로그인</title>
    <link rel="icon" type="image/png" href="/images/packing-logo.png" />
    <link rel="apple-touch-icon" href="/images/packing-logo.png" />
    <meta
      name="description"
      content="Packing에 로그인하고 여행 성향 추천과 일정 생성 기능을 사용해보세요."
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="dashboard-content auth-page">
          <section class="auth-layout" aria-labelledby="title">
            <div class="auth-hero">
              <span class="recommendation-eyebrow">WELCOME BACK</span>
              <h1>여행 취향에 맞는 다음 목적지를 찾아볼까요?</h1>
              <p>
                로그인하면 저장된 여행 성향을 바탕으로 추천 여행지와 일정 생성
                기능을 이어서 사용할 수 있습니다.
              </p>
              <div class="auth-benefits" aria-label="로그인 후 사용 가능한 기능">
                <span><i data-lucide="sparkles"></i> 성향 맞춤 추천</span>
                <span><i data-lucide="map"></i> 여행 일정 생성</span>
                <span><i data-lucide="bookmark"></i> 저장한 일정 확인</span>
              </div>
            </div>

            <div id="authWrap" class="auth-panel">
              <div class="auth-card">
                <div class="auth-card-header">
                  <span class="auth-card-icon">
                    <i data-lucide="user-round"></i>
                  </span>
                  <div>
                    <h2 id="title">로그인</h2>
                    <p id="subtitle" hidden></p>
                  </div>
                </div>

                <div id="alert" class="auth-alert"></div>

                <div id="nicknameWrap" class="auth-form-group" hidden>
                  <label for="nickname">닉네임</label>
                  <input
                    id="nickname"
                    type="text"
                    placeholder="닉네임 입력"
                    autocomplete="nickname"
                  />
                </div>

                <div class="auth-form-group">
                  <label for="email">이메일</label>
                  <input
                    id="email"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                  />
                </div>

                <div class="auth-form-group">
                  <label for="password">비밀번호</label>
                  <input
                    id="password"
                    type="password"
                    placeholder="비밀번호 입력"
                    autocomplete="current-password"
                  />
                </div>

                <div class="auth-button-row">
                  <button id="submitBtn" class="btn-primary auth-submit" type="button">
                    로그인
                  </button>
                  <button id="clearBtn" class="auth-secondary" type="button">
                    초기화
                  </button>
                </div>

                <div class="auth-button-row">
                  <button id="googleLoginBtn" class="auth-social auth-social-google" type="button" data-provider="google">
                    <span class="auth-social-content">
                      <span class="auth-social-icon auth-social-icon-google" aria-hidden="true">
                        <svg viewBox="0 0 24 24" role="img" focusable="false">
                          <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.4-1.7 4.1-5.5 4.1-3.3 0-5.9-2.7-5.9-6s2.6-6 5.9-6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.5 14.7 2.5 12 2.5 6.9 2.5 2.8 6.6 2.8 11.7S6.9 20.9 12 20.9c5.8 0 9.6-4.1 9.6-9.9 0-.7-.1-1.2-.2-1.7H12z"/>
                          <path fill="#34A853" d="M3.7 7.3l3.6 2.7C8.3 7.4 10 6.2 12 6.2c1.9 0 3.2.8 3.9 1.5l2.9-2.8C17.2 3.3 14.9 2.5 12 2.5 8.1 2.5 4.8 4.7 3.7 7.3z"/>
                          <path fill="#FBBC05" d="M12 20.9c2.6 0 4.9-0.9 6.7-2.5l-3.1-2.5c-.9.6-2 1-3.6 1-3 0-5.5-2-6.4-4.7L2 14.9C3 18.1 7 20.9 12 20.9z"/>
                          <path fill="#4285F4" d="M21.4 12.4c0-.7-.1-1.2-.2-1.7H12v3.5h5.5c-.3 1.5-1.2 2.7-2.7 3.5l3.1 2.5c1.8-1.7 2.8-4.1 2.8-7.8z"/>
                        </svg>
                      </span>
                      <span class="auth-social-label">구글로 계속하기</span>
                    </span>
                  </button>
                  <button id="kakaoLoginBtn" class="auth-social auth-social-kakao" type="button" data-provider="custom:kakao">
                    <span class="auth-social-content">
                      <span class="auth-social-icon auth-social-icon-kakao" aria-hidden="true">
                        <svg viewBox="0 0 24 24" role="img" focusable="false">
                          <path fill="#3A1D00" d="M12 3.2C7 3.2 3 6.4 3 10.3c0 2.5 1.7 4.7 4.4 5.9-.1.7-.6 2.1-.7 2.4-.1.2 0 .4.1.5.1.1.3.1.4 0 .2-.1 1.7-1.1 2.4-1.6.8.1 1.5.2 2.4.2 5 0 9-3.2 9-7.1S17 3.2 12 3.2z"/>
                        </svg>
                      </span>
                      <span class="auth-social-label">카카오로 계속하기</span>
                    </span>
                  </button>
                </div>

                <div class="auth-switch-row">
                  <button id="switchToSignup" class="auth-link-button" type="button">
                    회원가입으로 이동
                  </button>
                  <button
                    id="switchToLogin"
                    class="auth-link-button"
                    type="button"
                    hidden
                  >
                    로그인으로 이동
                  </button>
                </div>

                <div id="success" class="auth-success"></div>

                <p class="auth-note">
                  로그인이 필요한 메뉴로 이동했다면 로그인 후 해당 페이지로 다시
                  돌아갑니다.
                </p>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="/scripts/layout.js"></script>
    <script src="../scripts/login.js"></script>
  </body>
</html>
