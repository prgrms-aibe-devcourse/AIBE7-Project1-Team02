<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packing | AI Travel Planner</title>
    <link rel="icon" type="image/png" href="/images/packing-logo.png" />
    <link rel="apple-touch-icon" href="/images/packing-logo.png" />
    <meta
      name="description"
      content="AI가 분석한 여행 키워드로 나만의 국내 여행지를 추천하고 일정까지 만들어주는 서비스입니다."
    />
    <link rel="stylesheet" href="./styles/main.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="app-container">
      <div id="sidebar-container"></div>

      <div class="main-wrapper">
        <div id="header-container"></div>

        <main class="dashboard-content">
          <section
            class="recommendation-catalog"
            aria-labelledby="recommendation-title"
          >
            <div class="recommendation-catalog-header">
              <div>
                <span class="recommendation-eyebrow">TRAVEL MATCH</span>
                <h1 id="recommendation-title">내 여행 성향 추천</h1>
                <p class="recommendation-subtitle" id="recommendation-subtitle">
                  Supabase에 저장된 관광지 적합도 점수를 조회하고 있습니다.
                </p>
              </div>
              <a
                href="./pages/survey.html"
                class="btn-text"
                id="recommendation-link"
              >
                성향 다시 분석 <i data-lucide="chevron-right"></i>
              </a>
            </div>
            <div class="featured-recommendation-shell">
              <button
                class="featured-recommendation-control"
                id="recommendation-prev"
                type="button"
                aria-label="이전 추천 여행지"
              >
                <i data-lucide="chevron-left"></i>
              </button>
              <div
                class="featured-recommendation"
                id="recommendation-list"
                aria-live="polite"
              >
                <div class="recommendation-state">
                  <span class="recommendation-spinner" aria-hidden="true"></span>
                  <span>맞춤 여행지를 불러오는 중입니다.</span>
                </div>
              </div>
              <button
                class="featured-recommendation-control"
                id="recommendation-next"
                type="button"
                aria-label="다음 추천 여행지"
              >
                <i data-lucide="chevron-right"></i>
              </button>
            </div>
            <div class="featured-recommendation-footer">
              <div
                class="featured-recommendation-dots"
                id="recommendation-dots"
                aria-label="추천 여행지 슬라이드 선택"
              ></div>
              <span id="recommendation-position">0 / 0</span>
              <a
                class="btn-primary recommendation-explore-button"
                href="./pages/destinations.html"
              >
                여행지 더 찾아보기
                <i data-lucide="arrow-right"></i>
              </a>
            </div>
          </section>

        </main>
      </div>
    </div>

    <div
      class="destination-detail-overlay"
      id="destination-detail-modal"
      aria-hidden="true"
    >
      <article
        class="destination-detail-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="destination-detail-name"
      >
        <button
          class="destination-detail-close"
          id="destination-detail-close"
          type="button"
          aria-label="여행지 상세 닫기"
        >
          <i data-lucide="x"></i>
        </button>
        <img
          class="destination-detail-image"
          id="destination-detail-image"
          alt=""
        />
        <div
          class="destination-detail-image destination-detail-no-image"
          id="destination-detail-no-image"
          hidden
        >
          <i data-lucide="image-off"></i>
          <span>이미지 없음</span>
        </div>
        <div class="destination-detail-content">
          <div class="destination-detail-meta">
            <span id="destination-detail-rank">추천 순위</span>
            <span id="destination-detail-score">적합도 점수</span>
          </div>
          <h2 id="destination-detail-name">여행지 상세정보</h2>
          <p class="destination-detail-region" id="destination-detail-region">
            <i data-lucide="map-pin"></i>
            <span>대한민국</span>
          </p>
          <div
            class="destination-detail-keywords"
            id="destination-detail-keywords"
          ></div>
          <p
            class="destination-detail-description"
            id="destination-detail-description"
          ></p>
          <div class="destination-detail-reason" id="destination-detail-reason">
            <strong>추천 이유</strong>
            <p></p>
          </div>
          <button
            class="btn-primary destination-detail-action"
            id="destination-detail-action"
            type="button"
          >
            이 여행지로 일정 만들기 <i data-lucide="arrow-right"></i>
          </button>
          <button
            class="destination-detail-bookmark"
            id="destination-detail-bookmark"
            type="button"
          >
            ♡
          </button>
        </div>
      </article>
    </div>

    <div class="modal-overlay" id="flow-b-modal">
      <div class="modal-content">
        <button
          class="modal-close-btn"
          id="modal-close-btn"
          type="button"
          aria-label="닫기"
        >
          <i data-lucide="x"></i>
        </button>
        <section class="flow-b-section" id="destinations-flow">
          <div
            class="section-header"
            style="text-align: center; max-width: 600px; margin: 0 auto 2rem"
          >
            <h2>나만의 맞춤 여행지 선택</h2>
            <p>
              원하는 키워드를 최대 3개까지 선택해서 내 스타일에 맞는 국내
              여행지를 추천받아보세요.
            </p>
          </div>

          <div class="keyword-selector" id="keyword-container"></div>

          <div class="selection-counter" id="selection-counter">
            <div class="counter-dots">
              <span class="counter-dot" id="dot-1"></span>
              <span class="counter-dot" id="dot-2"></span>
              <span class="counter-dot" id="dot-3"></span>
            </div>
            <span class="counter-text" id="counter-text">0 / 3개 선택됨</span>
          </div>

          <div class="tooltip-container">
            <div class="tooltip" id="max-selection-tooltip">
              최대 3개까지만 선택할 수 있습니다.
            </div>
          </div>

          <div class="preview-results" id="preview-results">
            <div class="empty-state" id="preview-empty">
              <i
                data-lucide="compass"
                style="
                  width: 48px;
                  height: 48px;
                  margin-bottom: 1rem;
                  opacity: 0.5;
                "
              ></i>
              <br />
              <span>키워드를 선택하면 추천 결과가 여기에 표시됩니다.</span>
            </div>
          </div>

          <div class="preview-action" style="text-align: center">
            <button
              class="btn-primary btn-glow disabled"
              id="btn-generate-itinerary"
              type="button"
              disabled
            >
              맞춤 여행지 보기
            </button>
          </div>
        </section>
      </div>
    </div>

    <script src="/scripts/layout.js"></script>
    <script src="./scripts/traveler-profile.js"></script>
    <script src="./scripts/app.js"></script>
  </body>
</html>
