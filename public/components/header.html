<header class="top-header">
  <div class="header-left">
    <button
      class="mobile-menu-toggle"
      id="mobile-toggle"
      type="button"
      aria-label="메뉴 열기"
    >
      <i data-lucide="menu"></i>
    </button>
    <div class="header-breadcrumb" id="header-breadcrumb">
      <!-- Breadcrumb info is dynamically set in layout.js based on path -->
      <span class="breadcrumb-icon" id="breadcrumb-icon-container"><i data-lucide="compass"></i></span>
      <span class="breadcrumb-text" id="breadcrumb-text-container">탐색하기</span>
    </div>
  </div>

  <div class="header-actions">
    <div class="search-bar">
      <i data-lucide="search" class="search-icon"></i>
      <input type="text" placeholder="목적지, 맛집, 액티비티 검색..." />
    </div>

    <div style="display: flex; align-items: center; gap: 10px; position: relative;" id="profile-dropdown-container">
      <span
        id="header-user-name"
        style="font-weight: 500"
      ></span>
      <div class="user-avatar-wrapper">
        <a href="/pages/login.html" id="login-link" style="display:block; width:100%; height:100%;">
          <img
            src="https://ui-avatars.com/api/?name=User&background=eaeaea&color=333"
            alt="User"
            id="header-user-avatar"
            class="user-avatar"
          />
        </a>
      </div>

      <!-- Dropdown Menu -->
      <div id="profile-dropdown" class="profile-dropdown-menu">
        <a href="/pages/mypage.html" class="dropdown-item">
          <i data-lucide="user"></i>
          <span>마이 페이지</span>
        </a>
        <button id="dropdown-logout-btn" class="dropdown-item dropdown-logout">
          <i data-lucide="log-out"></i>
          <span>로그아웃</span>
        </button>
      </div>
    </div>
  </div>
</header>
