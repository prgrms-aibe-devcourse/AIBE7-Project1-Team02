<header class="top-header">
  <div class="header-left">
    <button
      class="mobile-menu-toggle"
      id="mobile-toggle"
      type="button"
      aria-label="메뉴 열기"
    >
      <i data-lucide="menu"></i>
    </button>
    <div class="header-breadcrumb" id="header-breadcrumb">
      <!-- Breadcrumb info is dynamically set in layout.js based on path -->
      <span class="breadcrumb-icon" id="breadcrumb-icon-container"
        ><i data-lucide="compass"></i
      ></span>
      <span class="breadcrumb-text" id="breadcrumb-text-container"
        >탐색하기</span
      >
    </div>
  </div>

  <div class="header-actions">
    <div class="header-profile" id="profile-dropdown-container">
      <a
        class="header-login-button"
        id="header-login-button"
        href="/pages/login.html"
      >
        <i data-lucide="log-in" aria-hidden="true"></i>
        로그인
      </a>
      <div class="header-profile-text" id="header-profile-text" hidden>
        <span
          class="traveler-title-badge-subtle header-traveler-badge"
          id="header-traveler-badge"
          hidden
        ></span>
        <span id="header-user-name" class="header-user-name"></span>
      </div>
      <div class="user-avatar-wrapper" id="header-avatar-wrapper" hidden>
        <a
          href="/pages/login.html"
          id="login-link"
          style="display: block; width: 100%; height: 100%"
        >
          <img
            src="https://ui-avatars.com/api/?name=User&background=eaeaea&color=333"
            alt="User"
            id="header-user-avatar"
            class="user-avatar"
          />
        </a>
      </div>

      <!-- Dropdown Menu -->
      <div id="profile-dropdown" class="profile-dropdown-menu">
        <a href="/pages/mypage.html" class="dropdown-item">
          <i data-lucide="user"></i>
          <span>마이페이지</span>
        </a>
        <button id="dropdown-logout-btn" class="dropdown-item dropdown-logout">
          <i data-lucide="log-out"></i>
          <span>로그아웃</span>
        </button>
      </div>
    </div>
  </div>
</header>
